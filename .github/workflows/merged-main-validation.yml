name: merged-main-validation

on:
  push:
    branches: ["ci/check-merged-main"]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Run full test suite
        run: pytest -q

      - name: Compile Python sources
        run: python -m compileall backend decision_engine digital_twin ml scripts
