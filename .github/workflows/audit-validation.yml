name: audit-validation

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Run full test suite
        run: pytest -q
      - name: Run API smoke test
        shell: bash
        run: |
          python -m uvicorn backend.app.main:app --host 127.0.0.1 --port 8000 > /tmp/fleetavail-uvicorn.log 2>&1 &
          server_pid=$!
          trap 'kill $server_pid 2>/dev/null || true' EXIT
          python -c "import time; time.sleep(3)"
          python scripts/run_smoke_test.py
      - name: Compile Python sources
        run: python -m compileall backend decision_engine digital_twin ml scripts
