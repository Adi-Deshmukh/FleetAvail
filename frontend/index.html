<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>FleetAvail</title><style>body{margin:0;background:#07111f;color:#e8eef7;font:14px Arial}main{max-width:1200px;margin:auto;padding:24px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.card{background:#0e1b2d;border:1px solid #20334a;border-radius:10px;padding:16px}.kpi{font-size:28px;font-weight:700;margin-top:8px}table{width:100%;border-collapse:collapse;margin-top:16px}td,th{padding:9px;border-bottom:1px solid #20334a;text-align:left}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}button{padding:8px 12px;background:#143253;color:white;border:1px solid #2a4d73;border-radius:6px}pre{white-space:pre-wrap}@media(max-width:800px){.grid,.row{grid-template-columns:1fr 1fr}}@media(max-width:550px){.grid,.row{grid-template-columns:1fr}}</style></head><body><main><h1>FleetAvail Command Center</h1><p>SIH26249 · Predictive Maintenance & Fleet Availability</p><div id="k" class="grid"></div><div class="row"><div class="card"><b>Fleet snapshot</b><table><tbody id="f"></tbody></table></div><div class="card"><b>Live telemetry</b><pre id="s">Connecting…</pre></div></div><div class="row"><div class="card"><b>What-if</b><p><select id="a"></select> <input id="d" type="number" value="20">% <button onclick="sim()">Simulate</button></p><pre id="w"></pre></div><div class="card"><b>Maintenance</b><p><select id="m"></select> <button onclick="rec()">Recommend</button></p><pre id="r"></pre></div></div></main><script>async function g(u){let r=await fetch(u);return r.json()}async function load(){let s=await g('/api/fleet/summary');k.innerHTML=[['Availability',s.current_availability_pct+'%'],['7-day',s.projected_7_day_availability_pct+'%'],['Ready',s.ready+'/'+s.total_aircraft],['Critical',s.critical_aircraft]].map(x=>'<div class="card"><small>'+x[0]+'</small><div class="kpi">'+x[1]+'</div></div>').join('');let fs=await g('/api/fleet/aircraft');f.innerHTML=fs.map(x=>'<tr><td>'+x.aircraft_id+'</td><td>'+x.status+'</td><td>'+x.engine.rul_cycles+'</td><td>'+x.engine.alert_level+'</td></tr>').join('');let o=fs.map(x=>'<option>'+x.aircraft_id+'</option>').join('');a.innerHTML=o;m.innerHTML=o}async function sim(){w.textContent=JSON.stringify(await fetch('/api/simulate/what-if',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({aircraft_id:a.value,degradation_pct:+d.value})}).then(x=>x.json()),null,2)}async function rec(){r.textContent=JSON.stringify(await fetch('/api/maintenance/recommend',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({aircraft_id:m.value,mission_priority:1})}).then(x=>x.json()),null,2)}function ws(){let x=new WebSocket((location.protocol==='https:'?'wss':'ws')+'://'+location.host+'/ws/telemetry');x.onmessage=e=>s.textContent=e.data;x.onclose=()=>setTimeout(ws,1500)}load();ws();setInterval(load,5000)</script></body></html>
